<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Badminton League</title><link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Badminton%20League%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%7D">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#fff;--tx:#000;--mu:#767676;--bd:#e4e4e4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--tx:#fff;--mu:#9a9a9a;--bd:#2b2b2b}}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;max-width:100%;overflow-x:hidden}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 "Helvetica Neue",Helvetica,Arial,sans-serif;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
h1{font-size:13px;font-weight:700;letter-spacing:.28em;margin:0;padding:14px 16px 12px;border-bottom:1px solid var(--tx)}

.w{padding:0 16px;max-width:560px;margin:auto}
.card{border-top:1px solid var(--bd);padding:7px 0;margin:0}
.card.box{border:1px solid var(--tx);padding:12px;margin:10px 0}
.mu{color:var(--mu);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--tx);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:15px 0 14px;font:600 10px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}

button.b{display:block;width:100%;background:var(--tx);color:var(--bg);border:1px solid var(--tx);border-radius:0;padding:13px 14px;font:600 11px "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;margin:8px 0}
button.g{background:transparent;color:var(--tx)}
.r button.b{width:auto;flex:none;margin:0;padding:8px 12px}
input,select{background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--tx);border-radius:0;padding:10px 0;font-size:16px;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--mu)}
.r{display:flex;gap:10px;align-items:center}.r>*{flex:1;min-width:0}
.sc{font-size:16px!important;width:48px!important;height:32px;flex:none;text-align:center;font-weight:700;border:1px solid var(--tx);padding:0}
.m{padding:7px 0;border-top:1px solid var(--bd)}.m .r{margin:2px 0}
.t{flex:1;font-weight:500;min-width:0;overflow-wrap:anywhere;font-size:14px}
.win{font-weight:700}.lose{color:var(--mu);font-weight:400}
table{width:100%;border-collapse:collapse}td,th{padding:9px 3px;text-align:center;border-bottom:1px solid var(--bd)}td:nth-child(2),th:nth-child(2){text-align:left}
th{font-size:9px;font-weight:600;color:var(--mu);letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--tx)}
.q td{font-weight:700}.q td:first-child:after{content:"*"}
.champ{text-align:center;background:var(--tx);color:var(--bg);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;padding:18px 10px;margin-top:10px;line-height:1.8}

:root{--lg:#2f6fdb;--qf:#d98a0b;--sf:#8250d8;--fn:#111}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--fn:#fff;--lg:#6a9bff;--qf:#f0a93a;--sf:#a98bf0}}
.L{--c:var(--lg)}.Q{--c:var(--qf)}.S{--c:var(--sf)}.F{--c:var(--fn)}
.m{border-top:0;border-left:3px solid var(--c,var(--bd));padding:6px 8px 6px 10px;margin:6px 0;background:color-mix(in srgb,var(--c,#888) 7%,transparent)}
.tag{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.12em;padding:1px 6px;border:1px solid var(--c);color:var(--c);margin-right:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;flex:none}
.t{display:flex;align-items:center}
.hs{display:flex;align-items:center;gap:8px}.hs:before{content:"";width:9px;height:9px;background:var(--c);flex:none}.hs small{margin-left:auto;font-weight:400;color:var(--mu);letter-spacing:.08em}
.wait{border:1px dashed var(--bd);color:var(--mu);padding:12px;margin:6px 0;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.pill{font-size:8px;letter-spacing:.1em;border:1px solid var(--tx);padding:0 4px;margin-left:6px;font-weight:600}
.q td{background:color-mix(in srgb,var(--tx) 6%,transparent)}.q td:first-child:after{content:""}
td.tn{text-align:left;white-space:nowrap}
.t.big{font-size:17px}
.ban{display:flex;justify-content:space-between;align-items:center;background:var(--c);color:#fff;padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.F .ban{color:var(--bg)}.ban small{font-weight:400;opacity:.85;letter-spacing:.08em}
.grp{border:1px solid var(--c);margin:14px 0;background:color-mix(in srgb,var(--c) 4%,transparent)}.gb{padding:4px 10px 8px}
b.wl{font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;margin-left:8px;color:#fff;border-radius:2px}b.wl.w{background:#1f9d55}b.wl.l{background:#c9453a}
@keyframes sr{from{opacity:.15;transform:translateX(-26px)}to{opacity:1;transform:none}}@keyframes sl{from{opacity:.15;transform:translateX(26px)}to{opacity:1;transform:none}}
#app.sr{animation:sr .22s ease}#app.sl{animation:sl .22s ease}
</style></head><body>
<h1>BADMINTON LEAGUE<small>V8</small></h1><div class="w" id="app"></div>
<nav id="nav"></nav>
<script>
const K='bl_v1';let S,tab='teams',msg='',cf=false;function note(t){msg=t;render();scrollTo(0,document.body.scrollHeight)}
const blank=()=>({pros:['','','','','',''],oth:['','','','','',''],pick:['','','','','',''],locked:false,sc:{}});
const C=['#e4572e','#2e86ab','#3a9d5d','#8e5bd1','#d9a31b','#d6467f','#2a9d8f','#7a6c5d'],BYES=()=>{const n=S.pros.length;return n>=5?8-n:0};S=blank();let CODE='',PIN='',ORG=false;const save=()=>{if(ORG&&CODE&&window.FB)FB.set(CODE,{pin:PIN,state:JSON.stringify(S)}).catch(()=>note('Could not save - check internet'))};
const $=h=>document.getElementById('app').innerHTML=h;
const T=i=>S.pick[i]?`${S.pros[i]||'Pro'} & ${S.pick[i]}`:'';
const LG=()=>{const n=S.pros.length,a=[];for(const st of[0,1])for(let i=st;i<n;i+=2)a.push([i,(i+1)%n]);return a};
function res(id,a,b){const s=S.sc[id];if(!s||s[0]==null||s[1]==null||s[0]===s[1])return null;return s[0]>s[1]?a:b}
function table(){const r=S.pros.map((_,i)=>({i,p:0,w:0,l:0,pf:0,pa:0}));
LG().forEach((m,k)=>{const s=S.sc['L'+k];if(!s||s[0]==null||s[1]==null||s[0]===s[1])return;
[[0,1],[1,0]].forEach(([x,y])=>{const t=r[m[x]];t.p++;t.pf+=s[x];t.pa+=s[y];s[x]>s[y]?t.w++:t.l++})});
r.forEach(t=>{t.pts=t.w*2;t.d=t.pf-t.pa});
return r.sort((a,b)=>b.pts-a.pts||b.d-a.d||b.pf-a.pf)}
const leagueDone=()=>LG().every((m,k)=>res('L'+k,1,2));
function setSc(id,j,v){S.sc[id]=S.sc[id]||[null,null];S.sc[id][j]=v===''?null:+v;save();show(true)}
function mc(id,a,b,label,st){const s=S.sc[id]||[],w=res(id,a,b);
const row=(t,j)=>`<div class="r"><div class="t ${w===t?'win'+(st!=='L'?' big':''):w!=null?'lose':''}"><i class="dot" style="background:${C[t%8]}"></i>${T(t)}${w===t&&st!=='L'?' 🏆':''}${w===t?'<b class="wl w">W</b>':w!=null?'<b class="wl l">L</b>':''}</div><input class="sc" type="number" inputmode="numeric" min="0" value="${s[j]??''}" onchange="setSc('${id}',${j},this.value)"></div>`;
return `<div class="m ${st}"><div class="mu"><span class="tag">${{L:'League',Q:'QF',S:'Semi',F:'Final'}[st]}</span>${label}</div>${row(a,0)}${row(b,1)}</div>`}
function show(keep){const y=scrollY;render();if(keep)scrollTo(0,y)}
function render(){if(!CODE)return gate();R0();if(!ORG)view()}
function view(){document.querySelectorAll('#app input,#app select,#app button.b').forEach(e=>{if(e.classList.contains('sh'))return;e.disabled=true;if(e.tagName=='BUTTON')e.style.display='none'})}
function R0(){
document.getElementById('nav').innerHTML=[['teams','Teams'],['league','Matches'],['table','Table'],['play','Playoffs']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
if(tab==='teams')return teams();
if(!S.locked)return $('<div class="card box">Teams are not locked yet.</div>');
if(tab==='league')return $('<h2 class="hs L">League stage<small>'+LG().filter((m,k)=>res('L'+k,m[0],m[1])).length+' / '+S.pros.length+' played</small></h2>'+LG().map((m,k)=>mc('L'+k,m[0],m[1],'Match '+(k+1),'L')).join(''));
if(tab==='table'){const t=table(),by=BYES();return $(`<h2>Standings · win = 2 pts</h2><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>+/-</th><th>Pts</th></tr>${t.map((x,n)=>`<tr class="${n<by?'q':''}"><td>${n+1}</td><td class="tn"><i class="dot" style="background:${C[x.i%8]}"></i>${T(x.i)}${n<by?'<span class="pill">BYE</span>':''}</td><td>${x.p}</td><td style="color:#1f9d55">${x.w}</td><td style="color:#c9453a">${x.l}</td><td>${x.d}</td><td><b>${x.pts}</b></td></tr>`).join('')}</table><div class="mu" style="margin:8px 0">${by?'Top '+by+' skip the quarter-finals · ':''}Ties: point difference, then points scored</div><button class="b sh" onclick="shareImg('table')">Share to WhatsApp</button>`)}
play()}
function PO(){const t=table().map(x=>x.i),n=t.length,sd=k=>k<=n?t[k-1]:null;let A,B,Q=[];if(n<=3)return{Q:[],S:[],F:{id:'F',a:sd(1),b:sd(2),l:'Final'}};
if(n===4){A=[sd(1),sd(4)];B=[sd(2),sd(3)]}else{const W=[];[[1,8],[4,5],[2,7],[3,6]].forEach(([x,y])=>{const a=sd(x),b=sd(y);if(b==null)W.push(a);else{const id='Q'+x+'v'+y;Q.push({id,a,b,l:'Seed '+x+' v '+y});W.push(res(id,a,b))}});A=[W[0],W[1]];B=[W[2],W[3]]}
const S2=[{id:'S1',a:A[0],b:A[1],l:'Semi 1'},{id:'S2',a:B[0],b:B[1],l:'Semi 2'}];
const f1=A[0]!=null&&A[1]!=null?res('S1',A[0],A[1]):null,f2=B[0]!=null&&B[1]!=null?res('S2',B[0],B[1]):null;
return{Q,S:S2,F:{id:'F',a:f1,b:f2,l:'Final'}}}
function play(){if(!leagueDone())return $('<div class="card box">Playoffs unlock when all league matches have scores (no ties).</div>');
const p=PO();let m=S.pros.length,h='';
const blk=(x,st)=>{const k=++m;return x.a!=null&&x.b!=null?mc(x.id,x.a,x.b,'Match '+k+' · '+x.l,st):'<div class="wait">Match '+k+' · '+x.l+' – waiting</div>'};
const G=(st,t,b,c)=>'<div class="grp '+st+'"><div class="ban"><span>'+t+'</span><small>'+c+'</small></div><div class="gb">'+b+'</div></div>';
if(p.Q.length)h+=G('Q','Quarter-finals',p.Q.map(x=>blk(x,'Q')).join(''),p.Q.length+' matches');
if(p.S.length)h+=G('S','Semi-finals',p.S.map(x=>blk(x,'S')).join(''),'2 matches');h+=G('F','🏆 Final',blk(p.F,'F'),'1 match');
const c=p.F.a!=null&&p.F.b!=null?res('F',p.F.a,p.F.b):null;
if(c!=null)h+=`<div class="champ">🏆<br>Champions<br><span style="font-size:20px">${T(c)}</span></div>`;
h+='<button class="b sh" onclick="shareImg(\'play\')">Share to WhatsApp</button>';$(h)}
async function shareImg(mode){const t=table(),by=BYES(),dn=leagueDone(),p=dn?PO():null,play=mode==='play';if(play&&!p)return;
const W=1080,P=56,F='"Helvetica Neue",Helvetica,Arial,sans-serif',it=[];const bar=(tx,c)=>it.push({k:'s',tx,c});
if(play){const cm=p.F.a!=null&&p.F.b!=null?res('F',p.F.a,p.F.b):null;if(cm!=null)it.push({k:'c',cm});
if(p.Q.length){bar('Quarter-finals','#d98a0b');p.Q.forEach(m=>it.push({k:'m',m,c:'#d98a0b',po:1}))}
if(p.S.length){bar('Semi-finals','#8250d8');p.S.forEach(m=>it.push({k:'m',m,c:'#8250d8',po:1}))}
bar('Final','#111');it.push({k:'m',m:p.F,c:'#111',po:1})}
else{bar('Standings','#111');t.forEach((r,i)=>it.push({k:'t',r:r,n:i+1,b:i<by}));bar('League matches','#2f6fdb');LG().forEach((m,k)=>it.push({k:'m',m:{id:'L'+k,a:m[0],b:m[1]},c:'#2f6fdb'}))}
const hh={s:90,t:76,m:92,c:170};let H=300;it.forEach(o=>H+=hh[o.k]);
const cv=document.createElement('canvas');cv.width=W;cv.height=H;const q=cv.getContext('2d');
const T2=(s,a,y,w,px,col,al,mx)=>{q.font=w+' '+px+'px '+F;q.fillStyle=col;q.textAlign=al||'left';q.fillText(s,a,y,mx)};
const ci=(xc,yc,fill,gl,gc)=>{q.fillStyle=fill;q.beginPath();q.arc(xc,yc,19,0,7);q.fill();T2(gl,xc,yc+10,'700',26,gc,'center')};
q.fillStyle='#fff';q.fillRect(0,0,W,H);q.fillStyle='#000';q.fillRect(0,0,W,190);
if('letterSpacing' in q)q.letterSpacing='8px';T2('BADMINTON LEAGUE',P,98,'700',44,'#fff');
if('letterSpacing' in q)q.letterSpacing='4px';T2((play?'PLAYOFFS':'STANDINGS')+'  ·  CODE '+CODE,P,148,'400',24,'#bbb');if('letterSpacing' in q)q.letterSpacing='0px';
let y=230;it.forEach(o=>{
if(o.k==='s'){q.fillStyle=o.c;q.fillRect(P,y+30,18,18);T2(o.tx.toUpperCase(),P+36,y+48,'700',28,'#111');q.fillStyle='#e6e6e6';q.fillRect(P,y+68,W-2*P,2)}
else if(o.k==='c'){q.fillStyle='#000';q.fillRect(P,y+10,W-2*P,140);T2('🏆  CHAMPIONS',W/2,y+62,'700',26,'#fff','center');T2(T(o.cm),W/2,y+122,'700',46,'#fff','center',W-2*P-40)}
else if(o.k==='t'){const r=o.r;if(o.b){q.fillStyle='#f2f2f2';q.fillRect(P,y,W-2*P,70)}
T2(String(o.n),P+18,y+48,'700',32,'#111');q.fillStyle=C[r.i%8];q.beginPath();q.arc(P+90,y+36,12,0,7);q.fill();
T2(T(r.i),P+118,y+47,'600',34,'#111','left',520);T2(r.w+'W',W-P-250,y+46,'700',28,'#1f9d55','right');T2(r.l+'L',W-P-170,y+46,'700',28,'#c9453a','right');T2(String(r.pts),W-P-16,y+48,'700',40,'#111','right')}
else{const m=o.m,a=m.a,b=m.b,kn=a!=null&&b!=null,w=kn?res(m.id,a,b):null,sc=S.sc[m.id]||[];
q.fillStyle=o.c;q.fillRect(P,y+8,8,76);
const side=(tm,left)=>{const win=w!=null&&w===tm,los=w!=null&&!win,ix=left?P+52:W-P-26;
if(win){o.po?T2('🏆',ix,y+60,'400',36,'#000','center'):ci(ix,y+48,'#1f9d55','✓','#fff')}else if(los)ci(ix,y+48,'#f3dedb','✕','#c9453a');
T2(tm==null?'TBD':T(tm),left?P+90:W-P-72,y+58,win?'700':'400',30,los||tm==null?'#999':'#111',left?'left':'right',310)};
side(a,true);side(b,false);
(w!=null&&sc[0]!=null)?T2(sc[0]+' – '+sc[1],W/2,y+60,'700',40,'#111','center'):T2('vs',W/2,y+58,'400',28,'#999','center')}
y+=hh[o.k]});
T2('LIVE  '+location.href.split('#')[0].replace(/^https?:\/\//,''),P,H-70,'400',26,'#777');T2('Open the link · enter code '+CODE,P,H-32,'400',24,'#999');
cv.toBlob(async bl=>{const f=new File([bl],'badminton-league.png',{type:'image/png'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:'🏸 Badminton League\nLive: '+location.href.split('#')[0]+'\nCode: '+CODE})}catch(e){}}
else{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='badminton-league.png';a.click()}})}
const TABS=['teams','league','table','play'];let tx0=0,ty0=0;
function go(d){const i=TABS.indexOf(tab)+d;if(i<0||i>3)return;tab=TABS[i];render();const el=document.getElementById('app');el.classList.remove('sr','sl');void el.offsetWidth;el.classList.add(d>0?'sr':'sl');scrollTo(0,0)}
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx0=t.clientX;ty0=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{if(!CODE)return;const t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;go(dx>0?1:-1)},{passive:true});
function teams(){let h='';if(!ORG&&!S.locked)return $('<div class="card box">Teams not announced yet. This page updates live.</div>');
if(S.locked){h+='<h2>Teams</h2>'+(ORG?'<div class="mu">Edit a name any time to substitute a player</div>':'')+S.pros.map((_,i)=>`<div class="m" style="--c:${C[i%8]}"><div class="mu">Team ${i+1}</div>${ORG?`<div class="r"><input value="${S.pros[i]}" onchange="S.pros[${i}]=this.value.trim();save()"><input value="${S.pick[i]}" onchange="S.pick[${i}]=this.value.trim();save()"></div>`:`<div class="t win">${T(i)}</div>`}</div>`).join('')+(Object.keys(S.sc).length?'':'<button class="b g" onclick="S.locked=false;save();render()">Edit teams</button>')+(cf?'<div class="card box"><b>Erase all teams and scores?</b><br><button class="b" style="background:#d93025" onclick="S=blank();save();cf=false;msg=\'\';render()">Yes, reset</button><button class="b g" onclick="cf=false;render()">Cancel</button></div>':'<button class="b g" onclick="cf=true;render()">Reset league</button>');return $(h)}
h+='<h2>1. Pairs ('+S.pros.length+' teams)</h2><div class="mu">Rows are just two lists (pros / partner pool). The real pairs are made only by the picks or the draw below. Add or remove rows (3 to 8 teams, odd or even).</div><div class="card box">'+S.pros.map((p,i)=>`<div class="r" style="margin:3px 0"><input placeholder="Pro ${i+1}" value="${p}" onchange="S.pros[${i}]=this.value.trim();save()"><input placeholder="Partner ${i+1}" value="${S.oth[i]}" onchange="S.oth[${i}]=this.value.trim();save()"><button class="b g" style="flex:none;padding:8px 12px" onclick="delRow(${i})">✕</button></div>`).join('')+'</div><button class="b g" onclick="addRow()">+ Add pair</button>';
h+='<h2>2. Partner picks</h2><div class="mu">Pros send their pick privately on WhatsApp – select it here, or press the lottery.</div><div class="card box">';
S.pros.forEach((p,i)=>{const used=S.pick.filter((x,j)=>x&&j!==i);
h+=`<div class="r" style="margin:4px 0"><div class="t">${p||'Pro '+(i+1)}</div><select onchange="S.pick[${i}]=this.value;save();render()"><option value="">– pick –</option>${S.oth.filter(o=>o&&!used.includes(o)).map(o=>`<option ${S.pick[i]===o?'selected':''}>${o}</option>`).join('')}</select></div>`});
h+='</div><button class="b" onclick="lottery()">Lottery draw</button><button class="b" onclick="lock()">Lock teams & start</button>'+(msg?'<div class="card" style="color:#d93025">'+msg+'</div>':'');$(h)}
function addRow(){if(S.pros.length>=8)return note('Maximum 8 pairs');S.pros.push('');S.oth.push('');S.pick.push('');save();render()}
function delRow(i){if(S.pros.length<=3)return note('Minimum 3 pairs');S.pros.splice(i,1);S.oth.splice(i,1);S.pick.splice(i,1);S.pick=S.pick.map(x=>S.oth.includes(x)?x:'');save();render()}
function lottery(){const o=S.oth.filter(Boolean);if(o.length<S.pros.length||S.pros.some(p=>!p))return note('Enter all names first.');
let k=0;do{for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}}while(o.some((x,i)=>x===S.oth.filter(Boolean)[i])&&++k<200);S.pick=o;save();render()}
function lock(){msg='';if(S.pros.some(p=>!p)||S.pick.some(p=>!p))return note('Fill every pro and partner pick.');S.locked=true;save();tab='league';render()}
function share(){open('https://wa.me/?text='+encodeURIComponent('🏸 Badminton League – live scores\nOpen: '+location.href.split('#')[0]+'\nLeague code: '+CODE))}
render();
function gate(){document.getElementById('nav').innerHTML='';let q={};try{q=JSON.parse(localStorage.getItem('bl_sess'))||{}}catch(e){}
$(`<h2>Open a league</h2><div class="card box"><input id="gc" placeholder="League code (e.g. DVG2026)" value="${q.c||''}" style="margin:3px 0"><input id="gp" type="password" placeholder="Organizer PIN (organizers only)" value="${q.p||''}" style="margin:3px 0"></div><button class="b" onclick="enter(0)">Watch live</button><button class="b g" onclick="enter(1)">Organizer login</button>`+(msg?'<div class="card" style="color:#d93025">'+msg+'</div>':''))}
async function enter(org){const g=i=>document.getElementById(i).value.trim();const c=g('gc').toUpperCase().replace(/[^A-Z0-9]/g,''),p=g('gp');
if(c.length<4)return note('Code needs 4+ letters/numbers');if(!window.FB)return note('Still connecting - try again in a moment');
try{const d=await FB.get(c);
if(org){if(p.length<4)return note('Choose a PIN of 4+ characters');if(d&&d.pin!==p)return note('Wrong PIN for this league');PIN=p;ORG=true;CODE=c;S=d?JSON.parse(d.state):blank();if(!d)save()}
else{if(!d)return note('League not found - check the code');CODE=c;ORG=false;S=JSON.parse(d.state);FB.listen(c,x=>{if(x){S=JSON.parse(x.state);const y=scrollY;render();scrollTo(0,y)}})}
msg='';try{localStorage.setItem('bl_sess',JSON.stringify({c,p:org?p:''}))}catch(e){}tab=ORG?'teams':'table';render()}catch(e){note('Connection problem: '+e.message)}}
</script>
